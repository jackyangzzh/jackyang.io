  <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity=".35"/></filter>
  <filter id="glint" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="food-shadow" x="-30%" y="-50%" width="160%" height="220%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#182a28" flood-opacity=".35"/></filter>
  <filter id="blur" x="-30%" y="-150%" width="160%" height="400%"><feGaussianBlur stdDeviation="12"/></filter>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M1 1L5.5 3.5L1 6" fill="none" stroke="#b7c1d0" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1L5.5 3.5L1 6" fill="none" stroke="#a7cfff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<defs><g id="environment">
          <rect width="1200" height="800" fill="#080b10"/>
