<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">From capture to menu.</title><desc id="desc">Capture images and checkpoints, release the camera session, reconstruct locally, process outputs, preview in Quick Look, and upload USDZ with a thumbnail. Metadata is saved separately. Source photos stay on the device. Cancellation and failure have restart paths; unsupported capture hardware triggers a precondition failure.</desc>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#111722"/><stop offset=".55" stop-color="#080e17"/><stop offset="1" stop-color="#151c28"/></linearGradient>
  <radialGradient id="ambient"><stop stop-color="#b6d9ff" stop-opacity=".23"/><stop offset=".5" stop-color="#839fc8" stop-opacity=".08"/><stop offset="1" stop-color="#b6d9ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="warm-light"><stop stop-color="#e9c2a4" stop-opacity=".22"/><stop offset=".5" stop-color="#c59678" stop-opacity=".08"/><stop offset="1" stop-color="#c59678" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet-light"><stop stop-color="#bac2ff" stop-opacity=".13"/><stop offset="1" stop-color="#bac2ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="material" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#f3f0ea" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity=".11"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#fff" stop-opacity=".62"/><stop offset=".3" stop-color="#fff" stop-opacity=".18"/><stop offset=".65" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity=".32"/></linearGradient>
  <linearGradient id="inner-edge" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#fff" stop-opacity=".18"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
  <linearGradient id="specular" x1="0" y1="0" x2="1" y2=".25"><stop stop-color="#fff8ec" stop-opacity=".94"/><stop offset=".35" stop-color="#eaf4ff" stop-opacity=".4"/><stop offset="1" stop-color="#eaf4ff" stop-opacity="0"/></linearGradient>
  <linearGradient id="rim-light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bbdeff" stop-opacity="0"/><stop offset=".55" stop-color="#bbdeff" stop-opacity=".24"/><stop offset=".85" stop-color="#d5eeff" stop-opacity=".85"/><stop offset="1" stop-color="#fff5e9" stop-opacity=".8"/></linearGradient>
  <linearGradient id="lens" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#fff" stop-opacity=".08"/><stop offset=".3" stop-color="#fff" stop-opacity=".015"/><stop offset=".6" stop-color="#d5eaff" stop-opacity="0"/><stop offset="1" stop-color="#d5eaff" stop-opacity=".1"/></linearGradient>
  <linearGradient id="volume" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#d4e8ff" stop-opacity=".18"/><stop offset=".45" stop-color="#bac8db" stop-opacity=".025"/><stop offset="1" stop-color="#c7e1ff" stop-opacity=".12"/></linearGradient>
  <linearGradient id="porcelain" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#fafbfc"/><stop offset=".48" stop-color="#d4dce4"/><stop offset=".85" stop-color="#9baebf"/><stop offset="1" stop-color="#d7e7ef"/></linearGradient>
  <linearGradient id="plate-side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9eafbd"/><stop offset=".45" stop-color="#d9e1e7"/><stop offset="1" stop-color="#7c8e9d"/></linearGradient>
  <radialGradient id="dish-well"><stop stop-color="#cbd6df"/><stop offset=".8" stop-color="#d4dfe8"/><stop offset="1" stop-color="#f6f8fa"/></radialGradient>
  <linearGradient id="toast-side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d0a365"/><stop offset=".5" stop-color="#a26937"/><stop offset="1" stop-color="#694425"/></linearGradient>
  <radialGradient id="toast-top" cx=".4" cy=".3"><stop stop-color="#edce8f"/><stop offset=".6" stop-color="#d5ad6b"/><stop offset="1" stop-color="#a7713e"/></radialGradient>
  <linearGradient id="avocado" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cfdb8d"/><stop offset=".35" stop-color="#a5c579"/><stop offset=".75" stop-color="#5e9362"/><stop offset="1" stop-color="#355f48"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a2bb7e"/><stop offset=".45" stop-color="#587c5c"/><stop offset="1" stop-color="#284b3c"/></linearGradient>
  <linearGradient id="radish" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3df"/><stop offset="1" stop-color="#e6d0bf"/></linearGradient>
