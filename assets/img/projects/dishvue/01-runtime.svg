  <radialGradient id="ambient"><stop stop-color="#b6d9ff" stop-opacity=".23"/><stop offset=".5" stop-color="#839fc8" stop-opacity=".08"/><stop offset="1" stop-color="#b6d9ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="warm-light"><stop stop-color="#e9c2a4" stop-opacity=".22"/><stop offset=".5" stop-color="#c59678" stop-opacity=".08"/><stop offset="1" stop-color="#c59678" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet-light"><stop stop-color="#bac2ff" stop-opacity=".13"/><stop offset="1" stop-color="#bac2ff" stop-opacity="0"/></radialGradient>
