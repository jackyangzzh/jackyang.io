  <linearGradient id="specular" x1="0" y1="0" x2="1" y2=".25"><stop stop-color="#fff8ec" stop-opacity=".94"/><stop offset=".35" stop-color="#eaf4ff" stop-opacity=".4"/><stop offset="1" stop-color="#eaf4ff" stop-opacity="0"/></linearGradient>
  <linearGradient id="rim-light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bbdeff" stop-opacity="0"/><stop offset=".55" stop-color="#bbdeff" stop-opacity=".24"/><stop offset=".85" stop-color="#d5eeff" stop-opacity=".85"/><stop offset="1" stop-color="#fff5e9" stop-opacity=".8"/></linearGradient>
  <linearGradient id="lens" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#fff" stop-opacity=".08"/><stop offset=".3" stop-color="#fff" stop-opacity=".015"/><stop offset=".6" stop-color="#d5eaff" stop-opacity="0"/><stop offset="1" stop-color="#d5eaff" stop-opacity=".1"/></linearGradient>
  <linearGradient id="volume" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#d4e8ff" stop-opacity=".18"/><stop offset=".45" stop-color="#bac8db" stop-opacity=".025"/><stop offset="1" stop-color="#c7e1ff" stop-opacity=".12"/></linearGradient>
  <linearGradient id="porcelain" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#fafbfc"/><stop offset=".48" stop-color="#d4dce4"/><stop offset=".85" stop-color="#9baebf"/><stop offset="1" stop-color="#d7e7ef"/></linearGradient>
