<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">One menu. Multiple views.</title><desc id="desc">iPhone and iPad share Firestore records and Storage assets with visionOS. On-device capture feeds the editor. React Menu.js reads Firestore once but is not mounted. The active React App.js renders a standalone plant GLB in model-viewer.</desc>

<defs>
