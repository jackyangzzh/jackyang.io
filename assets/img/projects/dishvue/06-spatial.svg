<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A small window. A closer look.</title><desc id="desc">The detail window is 0.6 by 0.6 by 0.6 metres. Rotation uses the vertical axis. Magnification is clamped from 1 to 1.5 times. Model dimensions are not calibrated, and the scale cap does not guarantee geometry fits. Physical-size claims need measured asset dimensions and real-device comparison. Window repositioning and USDZ export do not create an in-app tabletop anchor.</desc>

<defs>
