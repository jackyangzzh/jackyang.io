<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc"><title id="title">Hermes coordinates across applications</title><desc id="desc">My current setup: Hermes routes bounded work and checks results outside each tool.</desc><defs><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#22d3ee"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#34d399"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a78bfa"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#fbbf24"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#fb7185"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker></defs><rect width="1000" height="670" fill="#020617"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="40" y="56" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Hermes coordinates across applications</text><text x="40" y="90" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="start">My current setup: Hermes routes bounded work and checks results outside each tool.</text><g class="box"><rect x="40" y="125" width="280" height="80" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="58" y="158" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">Me</text><text x="58" y="185" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Intent, limits, taste</text></g><g class="box"><rect x="360" y="125" width="600" height="80" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="378" y="158" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Hermes Agent</text><text x="378" y="185" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Picks context and sends a bounded task</text></g><path d="M324 165H356" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#purple)"/><path d="M660 205V232M140 232H860" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M140 232V258" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)" stroke-dasharray="7 6"/><path d="M380 232V258" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)" stroke-dasharray="7 6"/><path d="M620 232V258" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)" stroke-dasharray="7 6"/><path d="M860 232V258" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)" stroke-dasharray="7 6"/><g class="box"><rect x="40" y="262" width="200" height="80" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="58" y="295" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">VS Code</text><text x="58" y="322" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Copilot chat, CLI</text></g><g class="box"><rect x="280" y="262" width="200" height="80" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="298" y="295" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Claude, Codex</text><text x="298" y="322" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Coding sessions</text></g><g class="box"><rect x="520" y="262" width="200" height="80" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="538" y="295" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="start">OpenChamber</text><text x="538" y="322" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">OpenCode agents</text></g><g class="box"><rect x="760" y="262" width="200" height="80" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="778" y="295" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Browser, shell</text><text x="778" y="322" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Analytics + Git</text></g><path d="M140 342V372M380 342V372M620 342V372M860 342V372M140 372H860" fill="none" stroke="#34d399" stroke-width="2.5"/><path d="M660 372V398" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#green)"/><g class="box"><rect x="360" y="402" width="600" height="80" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="378" y="435" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Evidence back to Hermes</text><text x="378" y="462" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Diffs, test output, renders, read-backs</text></g><g class="box"><rect x="40" y="402" width="280" height="80" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="58" y="435" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">Me</text><text x="58" y="462" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Keep, change, or revert</text></g><path d="M356 442H324" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#purple)"/><path d="M660 482V518" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#green)"/><g class="box"><rect x="360" y="522" width="600" height="80" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="378" y="555" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="start">Reusable skills</text><text x="378" y="582" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Procedures Hermes loads next time</text></g><text x="40" y="645" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Dashed = access route. Solid = evidence and decisions. This setup postdates the July build.</text></g></svg>