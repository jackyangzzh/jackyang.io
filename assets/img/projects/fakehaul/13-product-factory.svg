<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1170" role="img" aria-labelledby="title desc"><title id="title">The product factory</title><desc id="desc">Several pipelines feed one storefront. No single job runs them all.</desc><defs><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#22d3ee"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#34d399"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a78bfa"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#fbbf24"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#fb7185"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker></defs><rect width="1000" height="1170" fill="#020617"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="40" y="56" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">The product factory</text><text x="40" y="90" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="start">Several pipelines feed one storefront. No single job runs them all.</text><g class="box"><rect x="40" y="120" width="920" height="80" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="58" y="153" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">Me: direction and taste</text><text x="58" y="180" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Batch targets, tone, corrections, and final approval</text></g><path d="M500 200V236" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#purple)"/><rect x="20" y="240" width="960" height="169" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8 6" opacity=".7"/><text x="40" y="268" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.2">CATALOG</text><g class="box"><rect x="40" y="284" width="280" height="105" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="58" y="317" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="start">Catalog model</text><text x="58" y="344" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Up to 20 listings a call</text><text x="58" y="369" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Names, prices, options</text></g><g class="box"><rect x="360" y="284" width="280" height="105" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="378" y="317" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Script checks</text><text x="378" y="344" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Collisions, clamps</text><text x="378" y="369" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Allowlists, brand filter</text></g><g class="box"><rect x="680" y="284" width="280" height="105" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="698" y="317" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">4 catalog files</text><text x="698" y="344" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">1,800 products</text><text x="698" y="369" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">84 fictional sellers</text></g><path d="M324 336.5H356" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><path d="M644 336.5H676" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><path d="M500 409V429M180 429H820" fill="none" stroke="#94a3b8" stroke-width="2.5"/><path d="M180 429V455" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><path d="M500 429V455" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><path d="M820 429V455" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="40" y="459" width="280" height="105" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="58" y="492" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="start">Image model</text><text x="58" y="519" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Brief + angle per call</text><text x="58" y="544" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Resumable, rate-limited</text></g><path d="M180 568V594" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="40" y="598" width="280" height="105" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="58" y="631" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">Stage + approve</text><text x="58" y="658" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Approval-path angles</text><text x="58" y="683" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Reject → regenerate</text></g><path d="M180 707V733" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="40" y="737" width="280" height="105" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="58" y="770" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Versioned WebP</text><text x="58" y="797" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">640 × 640, hashed names</text><text x="58" y="822" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Old URLs kept</text></g><g class="box"><rect x="360" y="459" width="280" height="105" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="378" y="492" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="start">Review model</text><text x="378" y="519" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">One product per request</text><text x="378" y="544" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Composed voices</text></g><path d="M500 568V594" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="360" y="598" width="280" height="105" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="378" y="631" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Sanitize + checkpoint</text><text x="378" y="658" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Ranges, filters, resume</text><text x="378" y="683" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Partial batches OK</text></g><path d="M500 707V733" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="360" y="737" width="280" height="105" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="378" y="770" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">64 review shards</text><text x="378" y="797" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">15,104 reviews</text><text x="378" y="822" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">1,676 products</text></g><g class="box"><rect x="680" y="459" width="280" height="105" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="698" y="492" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">Authored packs</text><text x="698" y="519" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">6 reviews + 4 Q&amp;A</text><text x="698" y="544" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">for 124 products</text></g><path d="M820 568V594" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="680" y="598" width="280" height="105" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="698" y="631" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Builder checks</text><text x="698" y="658" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">IDs, counts, variants</text><text x="698" y="683" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">No inference call</text></g><path d="M820 707V733" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="680" y="737" width="280" height="105" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="698" y="770" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Stored profiles</text><text x="698" y="797" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">744 reviews, 496 Q&amp;A</text><text x="698" y="822" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Others: seeded pools</text></g><path d="M180 846V866M500 846V866M820 846V866M180 866H820" fill="none" stroke="#22d3ee" stroke-width="2.5"/><path d="M260 866V920" fill="none" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#cyan)"/><path d="M740 866V920" fill="none" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#cyan)"/><rect x="20" y="880" width="960" height="194" rx="16" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 6" opacity=".7"/><text x="40" y="908" fill="#22d3ee" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.2">AT PAGE RENDER</text><g class="box"><rect x="40" y="924" width="440" height="130" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="58" y="957" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Server</text><text x="58" y="984" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Catalog + image URLs</text><text x="58" y="1009" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Reviews: profile → shard → fallback</text><text x="58" y="1034" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Stored Q&amp;A passed as props</text></g><g class="box"><rect x="520" y="924" width="440" height="130" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="538" y="957" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Browser</text><text x="538" y="984" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Seeded Q&amp;A for the other 1,676</text><text x="538" y="1009" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Synthetic seller stats and histogram</text><text x="538" y="1034" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Counters: product hash + local drift</text></g><text x="40" y="1115" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Amber = model call · Green = script · Purple = human input · Cyan = files and UI</text><text x="40" y="1143" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Products, sellers, reviews, and counts are all fictional.</text></g></svg>