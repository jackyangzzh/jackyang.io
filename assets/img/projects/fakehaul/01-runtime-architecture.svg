<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 905" role="img" aria-labelledby="title desc"><style>svg{--bg:#F1EFE9;--bg2:#E8E5DD;--ink:#151413;--ink2:#45433F;--muted:#67645D;--amber:#8A5300;--green:#0F6B48;--blue:#2456B0;--violet:#5E42AE;--sig:#B53017}@media (prefers-color-scheme:dark){svg{--bg:#0E0E0D;--bg2:#181816;--ink:#EDEBE5;--ink2:#BEBBB3;--muted:#8F8C84;--amber:#D08A2A;--green:#2AAA79;--blue:#6E97F5;--violet:#A693EC;--sig:#FF6E4F}}[fill="#020617"]{fill:var(--bg)}[fill="#0f172a"]{fill:var(--bg2)}[fill="#f8fafc"]{fill:var(--ink)}[fill="#e2e8f0"]{fill:var(--ink2)}[fill="#94a3b8"]{fill:var(--muted)}[stroke="#94a3b8"]{stroke:var(--muted)}[fill="#fbbf24"]{fill:var(--amber)}[stroke="#fbbf24"]{stroke:var(--amber)}[fill="#34d399"]{fill:var(--green)}[stroke="#34d399"]{stroke:var(--green)}[fill="#22d3ee"]{fill:var(--blue)}[stroke="#22d3ee"]{stroke:var(--blue)}[fill="#a78bfa"]{fill:var(--violet)}[stroke="#a78bfa"]{stroke:var(--violet)}[fill="#fb7185"]{fill:var(--sig)}[stroke="#fb7185"]{stroke:var(--sig)}rect[rx="12"]{rx:6px}text{font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}text[font-size="30"]{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-weight:400;font-size:36px}text[letter-spacing]{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:400;font-size:14px}text[font-weight="600"]{font-weight:500}</style><title id="title">Three boundaries, one application</title><desc id="desc">Models run before deploy. The server renders from files. Shopping state stays in the browser.</desc><defs><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#22d3ee"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#34d399"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a78bfa"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#fbbf24"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#fb7185"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker></defs><rect width="1000" height="905" fill="#020617"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="40" y="56" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Three boundaries, one application</text><text x="40" y="90" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="start">Models run before deploy. The server renders from files. Shopping state stays in the browser.</text><rect x="20" y="120" width="960" height="169" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8 6" opacity=".7"/><text x="40" y="148" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.2">OFFLINE</text><g class="box"><rect x="40" y="164" width="280" height="105" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="58" y="197" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="start">Model calls</text><text x="58" y="224" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Catalog copy and reviews</text><text x="58" y="249" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Product images</text></g><g class="box"><rect x="360" y="164" width="280" height="105" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="378" y="197" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Scripts</text><text x="378" y="224" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Validate and stage</text><text x="378" y="249" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Write accepted artifacts</text></g><g class="box"><rect x="680" y="164" width="280" height="105" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="698" y="197" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Deployed files</text><text x="698" y="224" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Catalog JSON, review shards</text><text x="698" y="249" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">WebP images + manifest</text></g><path d="M324 216.5H356" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/><path d="M644 216.5H676" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/><path d="M500 293V335" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/><text x="516" y="320" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Read from disk. No model calls at request time.</text><rect x="20" y="339" width="960" height="169" rx="16" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="8 6" opacity=".7"/><text x="40" y="367" fill="#34d399" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.2">SERVER</text><g class="box"><rect x="40" y="383" width="280" height="105" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="58" y="416" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Pages</text><text x="58" y="443" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">App Router HTML</text><text x="58" y="468" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Catalog + image URLs</text></g><g class="box"><rect x="360" y="383" width="280" height="105" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="378" y="416" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Discovery API</text><text x="378" y="443" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Public catalog JSON</text><text x="378" y="468" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">No personal input</text></g><g class="box"><rect x="680" y="383" width="280" height="105" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="698" y="416" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Image routes</text><text x="698" y="443" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Sharp + ImageResponse</text><text x="698" y="468" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Share and receipt PNGs</text></g><path d="M180 492V598" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#green)"/><path d="M500 492V598" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#green)"/><path d="M820 598V492" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#purple)" stroke-dasharray="7 6"/><text x="806" y="545" fill="#a78bfa" font-size="16" font-weight="400" text-anchor="end">Selected values only</text><rect x="20" y="558" width="960" height="285" rx="16" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 6" opacity=".7"/><text x="40" y="586" fill="#22d3ee" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.2">BROWSER</text><g class="box"><rect x="40" y="602" width="280" height="105" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="58" y="635" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Shopping UI</text><text x="58" y="662" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">React + Zustand</text><text x="58" y="687" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Server props + local state</text></g><g class="box"><rect x="360" y="602" width="280" height="105" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="378" y="635" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Local ranking</text><text x="378" y="662" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Recent views, follows</text><text x="378" y="687" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Seeded daily tiebreak</text></g><g class="box"><rect x="680" y="602" width="280" height="105" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="698" y="635" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">Share link</text><text x="698" y="662" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Bounded URL values</text><text x="698" y="687" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Rendered by the server</text></g><g class="box"><rect x="40" y="743" width="920" height="80" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="58" y="776" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">localStorage on https://fakehaul.com</text><text x="58" y="803" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Cart, orders, wishlist, follows, coupons, profile, discovery history</text></g><path d="M180 711V739" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#purple)" marker-start="url(#purple)"/><path d="M500 739V711" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#purple)"/><path d="M820 739V711" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#purple)"/><text x="40" y="880" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Logical boundaries, not separate services. Checkout never calls a payment provider.</text></g></svg>