<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Automate the execution, keep the decisions</title><desc id="desc">A summary of the working pattern, not one orchestration engine.</desc><defs><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#22d3ee"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#34d399"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a78bfa"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#fbbf24"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#fb7185"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker></defs><rect width="1000" height="570" fill="#020617"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="40" y="56" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Automate the execution, keep the decisions</text><text x="40" y="90" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="start">A summary of the working pattern, not one orchestration engine.</text><text x="40" y="135" fill="#a78bfa" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.2">ME</text><text x="360" y="135" fill="#34d399" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.2">COORDINATION</text><text x="680" y="135" fill="#22d3ee" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.2">AGENTS + SCRIPTS</text><g class="box"><rect x="40" y="152" width="280" height="80" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="58" y="185" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">Set the objective</text><text x="58" y="212" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Goal, limits, done criteria</text></g><g class="box"><rect x="360" y="152" width="280" height="80" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="378" y="185" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Scope a task</text><text x="378" y="212" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Context, target, stop point</text></g><g class="box"><rect x="680" y="152" width="280" height="80" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="698" y="185" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Execute</text><text x="698" y="212" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Edit, generate, run tests</text></g><path d="M324 192H356" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><path d="M644 192H676" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><path d="M820 236V280" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="40" y="284" width="280" height="80" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="58" y="317" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">Accept or reject</text><text x="58" y="344" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Does it feel right?</text></g><g class="box"><rect x="360" y="284" width="280" height="80" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="378" y="317" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Check the evidence</text><text x="378" y="344" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Does output match claims?</text></g><g class="box"><rect x="680" y="284" width="280" height="80" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="698" y="317" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Produce artifacts</text><text x="698" y="344" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Diffs, files, test output</text></g><path d="M676 324H644" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><path d="M356 324H324" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><path d="M40 324H24V192H36" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#purple)" stroke-dasharray="7 6"/><path d="M180 368V412" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="40" y="416" width="280" height="80" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="58" y="449" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">Approve live changes</text><text x="58" y="476" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Domain, billing, release</text></g><g class="box"><rect x="360" y="416" width="280" height="80" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="378" y="449" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Carry the approval</text><text x="378" y="476" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Scope stays unchanged</text></g><g class="box"><rect x="680" y="416" width="280" height="80" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="698" y="449" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Apply and read back</text><text x="698" y="476" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Deploy, then verify state</text></g><path d="M324 456H356" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><path d="M644 456H676" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><text x="40" y="545" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Schema-valid ≠ good copy. Green tests ≠ good UX. A ready preview ≠ approval to cut over.</text></g></svg>