<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 745" role="img" aria-labelledby="title desc"><title id="title">Reviews and Q&amp;A take different paths</title><desc id="desc">Reviews are model-written offline. Most Q&amp;A is assembled from seeded templates.</desc><defs><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#22d3ee"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#34d399"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a78bfa"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#fbbf24"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#fb7185"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker></defs><rect width="1000" height="745" fill="#020617"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="40" y="56" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="start">Reviews and Q&amp;A take different paths</text><text x="40" y="90" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="start">Reviews are model-written offline. Most Q&amp;A is assembled from seeded templates.</text><text x="40" y="138" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.2">REVIEWS</text><text x="360" y="138" fill="#a78bfa" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.2">PRODUCT PROFILES</text><text x="680" y="138" fill="#22d3ee" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.2">Q&amp;A</text><g class="box"><rect x="40" y="152" width="280" height="105" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="58" y="185" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="start">Model batches</text><text x="58" y="212" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">One product per request</text><text x="58" y="237" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">6 workers, 5 attempts</text></g><path d="M180 261V287" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="40" y="291" width="280" height="105" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="58" y="324" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Sanitizer</text><text x="58" y="351" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Bounds and ranges</text><text x="58" y="376" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Partial batches OK</text></g><path d="M180 400V426" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="40" y="430" width="280" height="105" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="58" y="463" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">64 review shards</text><text x="58" y="490" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">15,104 reviews</text><text x="58" y="515" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">1,676 products</text></g><path d="M180 539V571" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#green)"/><g class="box"><rect x="360" y="152" width="280" height="105" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="378" y="185" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">Authored packs</text><text x="378" y="212" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">6 reviews + 4 Q&amp;A</text><text x="378" y="237" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">per product</text></g><path d="M500 261V287" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="360" y="291" width="280" height="105" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="378" y="324" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Builder checks</text><text x="378" y="351" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">IDs, counts, variants</text><text x="378" y="376" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">No inference call</text></g><path d="M500 400V426" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="360" y="430" width="280" height="105" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="378" y="463" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Stored profiles</text><text x="378" y="490" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">124 products</text><text x="378" y="515" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">744 reviews, 496 Q&amp;A</text></g><path d="M500 539V571" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#green)"/><g class="box"><rect x="680" y="152" width="280" height="105" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="698" y="185" fill="#a78bfa" font-size="20" font-weight="600" text-anchor="start">Template pools</text><text x="698" y="212" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Category, universal</text><text x="698" y="237" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Vintage subjects</text></g><path d="M820 261V287" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="680" y="291" width="280" height="105" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="698" y="324" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Seeded assembly</text><text x="698" y="351" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Product ID picks</text><text x="698" y="376" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">questions and answers</text></g><path d="M820 400V426" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#muted)"/><g class="box"><rect x="680" y="430" width="280" height="105" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="698" y="463" fill="#22d3ee" font-size="20" font-weight="600" text-anchor="start">Fallback thread</text><text x="698" y="490" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Built in the browser</text><text x="698" y="515" fill="#e2e8f0" font-size="16" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ProductQA</text></g><path d="M820 539V571" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#green)"/><g class="box"><rect x="40" y="575" width="920" height="105" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="58" y="608" fill="#34d399" font-size="20" font-weight="600" text-anchor="start">Lookup at render time</text><text x="58" y="635" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Reviews: profile → shard → seeded fallback</text><text x="58" y="660" fill="#e2e8f0" font-size="17" font-weight="400" text-anchor="start">Q&amp;A: profile → seeded templates</text></g><text x="40" y="720" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">All reviewers, ratings, and votes are fictional. No model call happens when a page loads.</text></g></svg>