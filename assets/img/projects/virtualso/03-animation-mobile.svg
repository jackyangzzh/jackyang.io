<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1580" viewBox="0 0 600 1580" role="img" aria-labelledby="animation-mobile-title animation-mobile-desc"><title id="animation-mobile-title">What drives the animation</title><desc id="animation-mobile-desc">Interviewer Animator parameters follow playback and recognizer state. Twelve audience randomizers select values zero, one, or two on independent repeating timers. No direct scene binding was found for the separate LookAt and NodDetector helpers.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#64B5FF" stroke-width="1.5"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#A7D49B" stroke-width="1.5"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#E9BB72" stroke-width="1.5"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#B9B9B9" stroke-width="1.5"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#343434" stroke-width=".7"/></pattern></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="600" height="1580" rx="0" fill="#202020" stroke="#202020" stroke-width="1.5"/><rect x="16" y="196" width="568" height="1314" rx="2" fill="#262626" stroke="#171717" stroke-width="1.5"/><rect x="16" y="196" width="568" height="1314" rx="2" fill="url(#grid)" stroke="#171717" stroke-width="1.5"/><text x="32" y="40" font-size="21" font-weight="600" fill="#64B5FF" text-anchor="start">VIRTUALSO / UNITY 2020.3</text><text x="32" y="94" font-size="36" font-weight="600" fill="#F0F0F0" text-anchor="start">What drives</text><text x="32" y="136" font-size="36" font-weight="600" fill="#F0F0F0" text-anchor="start">the animation</text><text x="32" y="173" font-size="19" font-weight="600" fill="#B9B9B9" text-anchor="start">SOURCE SCHEMATIC</text><rect x="32" y="218" width="536" height="144" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="219" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="49" y="251" font-size="21" font-weight="600" fill="#A7D49B" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">C#</text><text x="93" y="252" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">CharacterController</text><text x="50" y="302" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Read AudioSource.isPlaying.</text><text x="50" y="336" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Read SpeechToText.Active.</text><path d="M300 362V390" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><rect x="32" y="401" width="536" height="132" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="402" width="534" height="48" rx="2" fill="#245A80" stroke="#171717" stroke-width="1.5"/><text x="50" y="435" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">When audio is playing</text><text x="50" y="485" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">isTalking = true</text><text x="50" y="519" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">isListening = false</text><rect x="32" y="552" width="536" height="132" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="553" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="50" y="586" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">When audio is idle</text><text x="50" y="636" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">isTalking = false</text><text x="50" y="670" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">isListening = STT.Active</text><text x="32" y="738" font-size="21" font-weight="600" fill="#64B5FF" text-anchor="start">PRESENTATION AUDIENCE</text><text x="32" y="777" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">12 enabled randomizer components</text><g transform="translate(101 821) scale(1.7)" fill="none" stroke="#64B5FF" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><g transform="translate(233 821) scale(1.7)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><g transform="translate(365 821) scale(1.7)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><g transform="translate(497 821) scale(1.7)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><g transform="translate(101 869) scale(1.7)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><g transform="translate(233 869) scale(1.7)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><g transform="translate(365 869) scale(1.7)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><g transform="translate(497 869) scale(1.7)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><g transform="translate(101 917) scale(1.7)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><g transform="translate(233 917) scale(1.7)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><g transform="translate(365 917) scale(1.7)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><g transform="translate(497 917) scale(1.7)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><rect x="32" y="960" width="536" height="304" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="961" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="50" y="994" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">Inspector / audience timing</text><text x="50" y="1046" font-size="25" font-weight="400" fill="#F0F0F0" text-anchor="start">Frequency</text><rect x="324" y="1017" width="226" height="40" rx="2" fill="#292929" stroke="#626262" stroke-width="1.5"/><text x="339" y="1046" font-size="25" font-weight="400" fill="#F0F0F0" text-anchor="start">5</text><text x="50" y="1095" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Start samples one interval: 5–10 s.</text><text x="50" y="1130" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Invoke immediately, then repeat.</text><rect x="49" y="1165" width="502" height="70" rx="2" fill="#292929" stroke="#626262" stroke-width="1.5"/><text x="66" y="1207" font-size="25" font-weight="400" fill="#64B5FF" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">randomValue → {0, 1, 2}</text><rect x="32" y="1300" width="536" height="180" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><text x="50" y="1340" font-size="26" font-weight="600" fill="#E9BB72" text-anchor="start">Separate helper scripts</text><text x="50" y="1382" font-size="24" font-weight="400" fill="#B9B9B9" text-anchor="start">No direct main-scene binding found</text><text x="50" y="1416" font-size="24" font-weight="400" fill="#B9B9B9" text-anchor="start">for LookAt or NodDetector.</text><text x="50" y="1450" font-size="24" font-weight="400" fill="#B9B9B9" text-anchor="start">Gaze animation ≠ eye tracking.</text><text x="32" y="1546" font-size="18" font-weight="400" fill="#B9B9B9" text-anchor="start">03 / ANIMATION INPUTS</text></g></svg>
