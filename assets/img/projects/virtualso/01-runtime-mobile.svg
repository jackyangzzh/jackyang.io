<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1510" viewBox="0 0 600 1510" role="img" aria-labelledby="runtime-mobile-title runtime-mobile-desc"><title id="runtime-mobile-title">The spoken interview runtime</title><desc id="runtime-mobile-desc">Unity speech components exchange text and audio with IBM Watson. BotControl gates recognition; the character maps playback and recognition state to Animator flags.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#64B5FF" stroke-width="1.5"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#A7D49B" stroke-width="1.5"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#E9BB72" stroke-width="1.5"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#B9B9B9" stroke-width="1.5"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#343434" stroke-width=".7"/></pattern></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="600" height="1510" rx="0" fill="#202020" stroke="#202020" stroke-width="1.5"/><rect x="16" y="196" width="568" height="1244" rx="2" fill="#262626" stroke="#171717" stroke-width="1.5"/><rect x="16" y="196" width="568" height="1244" rx="2" fill="url(#grid)" stroke="#171717" stroke-width="1.5"/><text x="32" y="40" font-size="21" font-weight="600" fill="#64B5FF" text-anchor="start">VIRTUALSO / UNITY 2020.3</text><text x="32" y="94" font-size="36" font-weight="600" fill="#F0F0F0" text-anchor="start">The spoken</text><text x="32" y="136" font-size="36" font-weight="600" fill="#F0F0F0" text-anchor="start">interview runtime</text><text x="32" y="173" font-size="19" font-weight="600" fill="#B9B9B9" text-anchor="start">SOURCE SCHEMATIC</text><rect x="32" y="228" width="536" height="226" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="229" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="49" y="261" font-size="21" font-weight="600" fill="#A7D49B" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">C#</text><text x="93" y="262" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">SpeechToText</text><text x="50" y="312" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Microphone → audio blocks</text><text x="50" y="346" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Final text → target InputField</text><rect x="49" y="381" width="502" height="55" rx="2" fill="#292929" stroke="#626262" stroke-width="1.5"/><text x="65" y="418" font-size="25" font-weight="400" fill="#64B5FF" text-anchor="start">↔  Watson Speech to Text</text><path d="M300 454V495" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><rect x="32" y="508" width="536" height="226" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="509" width="534" height="48" rx="2" fill="#245A80" stroke="#171717" stroke-width="1.5"/><text x="49" y="541" font-size="21" font-weight="600" fill="#A7D49B" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">C#</text><text x="93" y="542" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">SimpleBot</text><text x="50" y="592" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">InputField change → request</text><text x="50" y="626" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Reply text → target InputField</text><rect x="49" y="661" width="502" height="55" rx="2" fill="#292929" stroke="#626262" stroke-width="1.5"/><text x="65" y="698" font-size="25" font-weight="400" fill="#64B5FF" text-anchor="start">↔  Watson Assistant</text><path d="M300 734V775" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><rect x="32" y="788" width="536" height="226" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="789" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="49" y="821" font-size="21" font-weight="600" fill="#A7D49B" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">C#</text><text x="93" y="822" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">TextToSpeech</text><text x="50" y="872" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Text queue → synthesis</text><text x="50" y="906" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Audio queue → AudioSource</text><rect x="49" y="941" width="502" height="55" rx="2" fill="#292929" stroke="#626262" stroke-width="1.5"/><text x="65" y="978" font-size="25" font-weight="400" fill="#64B5FF" text-anchor="start">↔  Watson Text to Speech</text><rect x="32" y="1070" width="536" height="328" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="1071" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="50" y="1104" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">Inspector / turn coordination</text><text x="50" y="1160" font-size="26" font-weight="600" fill="#F0F0F0" text-anchor="start">BotControl</text><text x="50" y="1200" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">When STT is ready, pause recognition</text><text x="50" y="1234" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">while Assistant or TTS is busy.</text><path d="M50 1262H550" stroke="#626262" stroke-width="1"/><text x="50" y="1303" font-size="25" font-weight="600" fill="#F0F0F0" text-anchor="start">CharacterController → Animator</text><text x="50" y="1344" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Audio playback + recognizer state</text><text x="50" y="1378" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">set isTalking and isListening.</text><text x="32" y="1476" font-size="18" font-weight="400" fill="#B9B9B9" text-anchor="start">01 / RUNTIME ARCHITECTURE</text></g></svg>
