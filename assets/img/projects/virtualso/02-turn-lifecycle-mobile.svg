<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1730" viewBox="0 0 600 1730" role="img" aria-labelledby="turn-mobile-title turn-mobile-desc"><title id="turn-mobile-title">A turn is longer than an audio clip</title><desc id="turn-mobile-desc">The final transcript passes through Assistant, a text queue, pending synthesis, an audio queue, and playback. The existing completion predicate omits synthesis in flight.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#64B5FF" stroke-width="1.5"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#A7D49B" stroke-width="1.5"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#E9BB72" stroke-width="1.5"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#B9B9B9" stroke-width="1.5"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#343434" stroke-width=".7"/></pattern></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="600" height="1730" rx="0" fill="#202020" stroke="#202020" stroke-width="1.5"/><rect x="16" y="196" width="568" height="1464" rx="2" fill="#262626" stroke="#171717" stroke-width="1.5"/><rect x="16" y="196" width="568" height="1464" rx="2" fill="url(#grid)" stroke="#171717" stroke-width="1.5"/><text x="32" y="40" font-size="21" font-weight="600" fill="#64B5FF" text-anchor="start">VIRTUALSO / UNITY 2020.3</text><text x="32" y="94" font-size="36" font-weight="600" fill="#F0F0F0" text-anchor="start">A turn is longer</text><text x="32" y="136" font-size="36" font-weight="600" fill="#F0F0F0" text-anchor="start">than an audio clip</text><text x="32" y="173" font-size="19" font-weight="600" fill="#B9B9B9" text-anchor="start">SOURCE SCHEMATIC</text><rect x="32" y="220" width="536" height="144" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="221" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="50" y="254" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">1  Final transcript</text><text x="50" y="304" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">STT forwards the final text</text><text x="50" y="338" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">through an InputField.</text><path d="M300 364V382" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><rect x="32" y="390" width="536" height="144" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="391" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="50" y="424" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">2  Assistant request</text><text x="50" y="474" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">SimpleBot sends the text</text><text x="50" y="508" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">and receives the reply.</text><path d="M300 534V552" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><rect x="32" y="560" width="536" height="144" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="561" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="50" y="594" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">3  Text queue</text><text x="50" y="644" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Response text waits</text><text x="50" y="678" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">for synthesis.</text><path d="M300 704V722" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><rect x="32" y="730" width="536" height="144" rx="2" fill="#383838" stroke="#E9BB72" stroke-width="1.5"/><rect x="33" y="731" width="534" height="48" rx="2" fill="#245A80" stroke="#171717" stroke-width="1.5"/><text x="50" y="764" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">4  Synthesis in flight</text><text x="50" y="814" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Text has left the queue.</text><text x="50" y="848" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Audio has not arrived.</text><path d="M300 874V892" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><rect x="32" y="900" width="536" height="144" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="901" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="50" y="934" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">5  Audio queue</text><text x="50" y="984" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">The callback enqueues</text><text x="50" y="1018" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">the synthesized clip.</text><path d="M300 1044V1062" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><rect x="32" y="1070" width="536" height="144" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="1071" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="50" y="1104" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">6  Audio playback</text><text x="50" y="1154" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">AudioSource plays</text><text x="50" y="1188" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">the queued clip.</text><rect x="32" y="1260" width="536" height="365" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="33" y="1261" width="534" height="48" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="50" y="1294" font-size="27" font-weight="600" fill="#F0F0F0" text-anchor="start">Completion / IsFinished()</text><text x="50" y="1343" font-size="25" font-weight="400" fill="#F0F0F0" text-anchor="start">Checks playback + both queues.</text><text x="50" y="1394" font-size="26" font-weight="600" fill="#E9BB72" text-anchor="start">Missing: synthesis in flight</text><text x="50" y="1440" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Empty queues can coexist with</text><text x="50" y="1476" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">an active synthesis request.</text><text x="50" y="1512" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">Recognition may reopen before</text><text x="50" y="1548" font-size="25" font-weight="400" fill="#B9B9B9" text-anchor="start">the character’s reply is ready.</text><text x="50" y="1601" font-size="22" font-weight="400" fill="#B9B9B9" text-anchor="start">Source finding; timing not measured.</text><text x="32" y="1696" font-size="18" font-weight="400" fill="#B9B9B9" text-anchor="start">02 / TURN COORDINATION</text></g></svg>
