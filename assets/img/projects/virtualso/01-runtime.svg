roke-width="2"/><path d="M269 433V476" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><circle cx="269" cy="433" r="5" fill="#262626" stroke="#64B5FF" stroke-width="2"/><path d="M269 630V673" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><circle cx="269" cy="630" r="5" fill="#262626" stroke="#64B5FF" stroke-width="2"/><rect x="815" y="225" width="352" height="771" rx="0" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="815" y="225" width="352" height="40" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="829" y="252" font-size="21" font-weight="600" fill="#F0F0F0" text-anchor="start">▾  Inspector</text><g transform="translate(841 296) scale(1)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><text x="864" y="304" font-size="23" font-weight="600" fill="#F0F0F0" text-anchor="start">Turn coordination</text><rect x="831" y="328" width="320" height="40" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="845" y="355" font-size="21" font-weight="600" fill="#F0F0F0" text-anchor="start">▾  BotControl (Script)</text><text x="849" y="401" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">Update() checks:</text><rect x="849" y="427" width="18" height="18" rx="2" fill="#292929" stroke="#626262" stroke-width="1.5"/><path d="M853 436l4 4 6 -8" fill="none" stroke="#F0F0F0" stroke-width="2"/><text x="879" y="444" font-size="21" font-weight="400" fill="#F0F0F0" text-anchor="start">STT is ready</text><text x="849" y="489" font-size="21" font-weight="400" fill="#F0F0F0" text-anchor="start">Assistant processing</text><text x="849" y="520" font-size="21" font-weight="400" fill="#F0F0F0" text-anchor="start">or TTS unfinished</text><rect x="848" y="535" width="285" height="49" rx="2" fill="#292929" stroke="#565656" stroke-width="1.5"/><text x="861" y="567" font-size="21" font-weight="400" fill="#64B5FF" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">stt.Active = false</text><text x="849" y="622" font-size="20" font-weight="400" fill="#B9B9B9" text-anchor="start">Otherwise: resume listening</text><rect x="831" y="672" width="320" height="40" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="845" y="699" font-size="21" font-weight="600" fill="#F0F0F0" text-anchor="start">▾  CharacterController</text><text x="849" y="748" font-size="21" font-weight="400" fill="#F0F0F0" text-anchor="start">AudioSource playback</text><text x="849" y="779" font-size="21" font-weight="400" fill="#F0F0F0" text-anchor="start">+ recognizer Active</text><path d="M985 797V827" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><rect x="848" y="842" width="285" height="86" rx="2" fill="#292929" stroke="#565656" stroke-width="1.5"/><text x="865" y="871" font-size="20" font-weight="400" fill="#B9B9B9" text-anchor="start">Animator parameters</text><text x="865" y="908" font-size="21" font-weight="400" fill="#64B5FF" text-anchor="start">isTalking · isListening</text><text x="64" y="875" font-size="19" font-weight="600" fill="#64B5FF" text-anchor="start">Text hand-off</text><text x="64" y="912" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">Serialized targets connect the InputFields.</text><text x="64" y="943" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">The cloud skill determines the dialogue; Unity plays the reply.</text><rect x="33" y="996" width="1134" height="31" rx="0" fill="#383838" stroke="#171717" stroke-width="1.5"/><text x="47" y="1018" font-size="14" font-weight="400" fill="#64B5FF" text-anchor="start">●</text><text x="70" y="1018" font-size="17" font-weight="400" fill="#B9B9B9" text-anchor="start">Editor-inspired schematic  ·  Source-derived connections; no live service test</text><text x="40" y="1073" font-size="17" font-weight="600" fill="#B9B9B9" text-anch