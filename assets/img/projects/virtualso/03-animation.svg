size="14" font-weight="400" fill="#64B5FF" text-anchor="start">●</text><text x="70" y="1118" font-size="17" font-weight="400" fill="#B9B9B9" text-anchor="start">Editor-inspired schematic  ·  Audience motion has no speech-content input</text><text x="40" y="1173" font-size="17" font-weight="600" fill="#B9B9B9" text-anchor="start">03 / ANIMATION INPUTS</text><text x="1160" y="1173" font-size="17" font-weight="400" fill="#B9B9B9" text-anchor="end">Jack Yang</text></g></svg>
