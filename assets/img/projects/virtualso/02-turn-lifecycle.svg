<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="lifecycle-title lifecycle-desc"><title id="lifecycle-title">A turn is longer than an audio clip</title><desc id="lifecycle-desc">The completion check leaves a gap while synthesis is in flight. Unity Editor-inspired source schematic, not a captured editor window.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#64B5FF" stroke-width="1.5"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#A7D49B" stroke-width="1.5"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#E9BB72" stroke-width="1.5"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#B9B9B9" stroke-width="1.5"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#343434" stroke-width=".7"/></pattern></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="1120" rx="0" fill="#202020" stroke="#202020" stroke-width="1.5"/><text x="40" y="44" font-size="18" font-weight="600" fill="#64B5FF" text-anchor="start">VIRTUALSO  /  UNITY 2020.3</text><text x="40" y="101" font-size="40" font-weight="600" fill="#F0F0F0" text-anchor="start">A turn is longer than an audio clip</text><text x="40" y="143" font-size="23" font-weight="400" fill="#B9B9B9" text-anchor="start">The completion check leaves a gap while synthesis is in flight.</text><rect x="32" y="182" width="1136" height="856" rx="3" fill="#262626" stroke="#171717" stroke-width="1.5"/><rect x="33" y="183" width="1134" height="42" rx="0" fill="#383838" stroke="#383838" stroke-width="1.5"/><rect x="33" y="183" width="255" height="42" rx="0" fill="#454545" stroke="#454545" stroke-width="1.5"/><g transform="translate(55 203) scale(0.75)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><text x="74" y="211" font-size="20" font-weight="600" fill="#F0F0F0" text-anchor="start">Turn graph</text><text x="309" y="211" font-size="19" font-weight="400" fill="#B9B9B9" text-anchor="start">Control flow  /  qualitative sequence</text><rect x="33" y="225" width="1134" height="812" rx="0" fill="url(#grid)" stroke="#171717" stroke-width="1.5"/><rect x="64" y="266" width="316" height="140" rx="3" fill="#383838" stroke="#111111" stroke-width="1.5"/><rect x="65" y="267" width="314" height="43" rx="2" fill="#454545" stroke="#454545" stroke-width="1.5"/><g transform="translate(86 288) scale(0.8)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><text x="107" y="296" font-size="23" font-weight="600" fill="#F0F0F0" text-anchor="start">Final transcript</text><text x="82" y="344" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">STT writes the final text</text><text x="82" y="375" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">into the target InputField.</text><rect x="442" y="266" width="316" height="140" rx="3" fill="#383838" stroke="#111111" stroke-width="1.5"/><rect x="443" y="267" width="314" height="43" rx="2" fill="#454545" stroke="#454545" stroke-width="1.5"/><g transform="translate(464 288) scale(0.8)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><text x="485" y="296" font-size="23" font-weight="600" fill="#F0F0F0" text-anchor="start">Assistant request</text><text x="460" y="344" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">SimpleBot sends the text</text><text x="460" y="375" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">and receives a reply.</text><rect x="820" y="266" width="316" height="140" rx="3" fill="#383838" stroke="#111111" stroke-width="1.5"/><rect x="821" y="267" width="314" height="43" rx="2" fill="#454545" stroke="#454545" stroke-width="1.5"/><g transform="translate(842 288) scale(0.8)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><text x="863" y="296" font-size="23" font-weight="600" fill="#F0F0F0" text-anchor="start">Text queue</text><text x="838" y="344" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">Response text waits</text><text x="838" y="375" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">for speech synthesis.</text><path d="M380 336H435" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><path d="M758 336H813" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><path d="M978 406V456" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><rect x="820" y="466" width="316" height="159" rx="3" fill="#383838" stroke="#E9BB72" stroke-width="1.5"/><rect x="821" y="467" width="314" height="43" rx="2" fill="#245A80" stroke="#245A80" stroke-width="1.5"/><g transform="translate(842 488) scale(0.8)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><text x="863" y="496" font-size="23" font-weight="600" fill="#F0F0F0" text-anchor="start">Synthesis in flight</text><text x="838" y="544" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">Text has left its queue.</text><text x="838" y="575" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">Audio has not arrived.</text><text x="838" y="606" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">audioStatus = Processing</text><rect x="442" y="466" width="316" height="159" rx="3" fill="#383838" stroke="#111111" stroke-width="1.5"/><rect x="443" y="467" width="314" height="43" rx="2" fill="#454545" stroke="#454545" stroke-width="1.5"/><g transform="translate(464 488) scale(0.8)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><text x="485" y="496" font-size="23" font-weight="600" fill="#F0F0F0" text-anchor="start">Audio queue</text><text x="460" y="544" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">The callback enqueues</text><text x="460" y="575" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">the synthesized clip.</text><rect x="64" y="466" width="316" height="159" rx="3" fill="#383838" stroke="#111111" stroke-width="1.5"/><rect x="65" y="467" width="314" height="43" rx="2" fill="#454545" stroke="#454545" stroke-width="1.5"/><g transform="translate(86 488) scale(0.8)" fill="none" stroke="#B9B9B9" stroke-width="1.4"><path d="M0 -9L8 -4V5L0 10L-8 5V-4Z M-8 -4L0 1L8 -4 M0 1V10 M0 -9V1"/></g><text x="107" y="496" font-size="23" font-weight="600" fill="#F0F0F0" text-anchor="start">Audio playback</text><text x="82" y="544" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">AudioSource plays</text><text x="82" y="575" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">the next queued clip.</text><path d="M820 545H765" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><path d="M442 545H387" fill="none" stroke="#64B5FF" stroke-width="2.5" marker-end="url(#blue)"/><text x="840" y="659" font-size="19" font-weight="600" fill="#E9BB72" text-anchor="start">Potential early completion</text><rect x="64" y="701" width="1072" height="255" rx="2" fill="#383838" stroke="#171717" stroke-width="1.5"/><rect x="64" y="701" width="1072" height="40" rx="2" fill="#454545" stroke="#171717" stroke-width="1.5"/><text x="78" y="728" font-size="21" font-weight="600" fill="#F0F0F0" text-anchor="start">▾  Completion check  /  TextToSpeech.IsFinished()</text><text x="88" y="781" font-size="17" font-weight="600" fill="#B9B9B9" text-anchor="start">CURRENT PREDICATE</text><rect x="88" y="808" width="18" height="18" rx="2" fill="#292929" stroke="#626262" stroke-width="1.5"/><path d="M92 817l4 4 6 -8" fill="none" stroke="#F0F0F0" stroke-width="2"/><text x="119" y="825" font-size="22" font-weight="400" fill="#F0F0F0" text-anchor="start">AudioSource is not playing</text><rect x="88" y="850" width="18" height="18" rx="2" fill="#292929" stroke="#626262" stroke-width="1.5"/><path d="M92 859l4 4 6 -8" fill="none" stroke="#F0F0F0" stroke-width="2"/><text x="119" y="867" font-size="22" font-weight="400" fill="#F0F0F0" text-anchor="start">Text queue is empty</text><rect x="88" y="892" width="18" height="18" rx="2" fill="#292929" stroke="#626262" stroke-width="1.5"/><path d="M92 901l4 4 6 -8" fill="none" stroke="#F0F0F0" stroke-width="2"/><text x="119" y="909" font-size="22" font-weight="400" fill="#F0F0F0" text-anchor="start">Audio queue is empty</text><path d="M550 762L550 934" stroke="#565656" stroke-width="1"/><text x="576" y="781" font-size="17" font-weight="600" fill="#E9BB72" text-anchor="start">MISSING CONDITION</text><rect x="576" y="805" width="535" height="48" rx="2" fill="#292929" stroke="#74603D" stroke-width="1.5"/><text x="593" y="837" font-size="23" font-weight="400" fill="#E9BB72" text-anchor="start">Synthesis is no longer processing</text><text x="576" y="892" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">Empty queues can coexist with an active request.</text><text x="576" y="923" font-size="21" font-weight="400" fill="#B9B9B9" text-anchor="start">BotControl may then reopen recognition.</text><rect x="33" y="1006" width="1134" height="31" rx="0" fill="#383838" stroke="#171717" stroke-width="1.5"/><text x="47" y="1028" font-size="14" font-weight="400" fill="#64B5FF" text-anchor="start">●</text><text x="70" y="1028" font-size="17" font-weight="400" fill="#B9B9B9" text-anchor="start">Editor-inspired schematic  ·  Source-level interleaving; not a measured runtime trace</text><text x="40" y="1083" font-size="17" font-weight="600" fill="#B9B9B9" text-anchor="start">02 / TURN COORDINATION</text><text x="1160" y="1083" font-size="17" font-weight="400" fill="#B9B9B9" text-anchor="end">Jack Yang</text></g></svg>
