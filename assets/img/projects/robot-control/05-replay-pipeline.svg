<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">Replay construction and transport behavior</title><desc id="desc">Arm and gripper CSV fields map to model-specific curves. Key time is ten times row index divided by row count in each stream. A table distinguishes arm Play, gripper Play and slider seek calls.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#edf3fa"/></marker></defs>
<rect width="1000" height="640" fill="#0d1520"/>

<text x="28" y="30" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">(a)</text>
<text x="65" y="30" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="start">From recorded values to model transforms</text>
<rect x="28" y="60" width="258" height="142" rx="5" fill="#142b3d" stroke="#8fcaff" stroke-width="1.2"/>
<text x="157.0" y="89" fill="#8fcaff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="middle">CSV fields</text>
<text x="157.0" y="115" fill="#adbdcf" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Arm: field.angles.data0..5</text>
<text x="157.0" y="139" fill="#adbdcf" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Gripper: field.data</text>
<rect x="330" y="60" width="356" height="142" rx="5" fill="#172433" stroke="#52657b" stroke-width="1.2"/>
<text x="350" y="89" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" text-anchor="start">Model-specific mapping</text>
<text x="350" y="117" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Arm: signed radians → degrees</text>
<text x="350" y="144" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Joint axes: Y, X, X, X, Y, X</text>
<text x="350" y="171" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Gripper: s = 1 → 0; else 0.8 rad</text>
<rect x="730" y="60" width="242" height="142" rx="5" fill="#142f31" stroke="#87d7c6" stroke-width="1.2"/>
<text x="851.0" y="89" fill="#87d7c6" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="middle">Legacy Unity clips</text>
<text x="851.0" y="115" fill="#adbdcf" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle">18 curves per channel</text>
<text x="851.0" y="139" fill="#adbdcf" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Hardcoded joint paths</text>
<path d="M286,131 L328,131" fill="none" stroke="#edf3fa" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M686,131 L728,131" fill="none" stroke="#edf3fa" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="230" width="944" height="112" rx="5" fill="#111e2c" stroke="#2c3e52" stroke-width="1.2"/>
<text x="48" y="262" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">Key time:  τᵢ = (10 s)i / N</text>
<text x="48" y="301" fill="#adbdcf" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">i = 0, …, N − 1;  N is the row count of that stream.</text>
<path d="M567,248 L567,324" fill="none" stroke="#2c3e52" stroke-width="1" stroke-linejoin="round"/>
<text x="592" y="262" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Last key:  10(N − 1) / N seconds</text>
<text x="592" y="301" fill="#efbd85" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">Recorded timestamps are ignored.</text>
<text x="28" y="387" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">(b)</text>
<text x="65" y="387" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="start">Playback and seek behavior</text>
<path d="M28,412 L972,412" fill="none" stroke="#edf3fa" stroke-width="1.5" stroke-linejoin="round"/>
<text x="44" y="441" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">Control</text>
<text x="278" y="441" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">Arm</text>
<text x="638" y="441" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">Gripper</text>
<path d="M28,455 L972,455" fill="none" stroke="#52657b" stroke-width="1" stroke-linejoin="round"/>
<text x="44" y="491" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">Play</text>
<text x="278" y="483" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Play(); speed = 1</text>
<text x="278" y="510" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">normalizedTime = 0</text>
<text x="638" y="483" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">No Play() call; speed = 0.8</text>
<text x="638" y="510" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">normalizedTime = 0</text>
<path d="M28,531 L972,531" fill="none" stroke="#2c3e52" stroke-width="1" stroke-linejoin="round"/>
<text x="44" y="568" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">Slider seek(u)</text>
<text x="278" y="558" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Play(); speed = 0</text>
<text x="278" y="585" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">normalizedTime = u</text>
<text x="638" y="558" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Play(); speed = 0</text>
<text x="638" y="585" fill="#edf3fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">normalizedTime = u</text>
<path d="M28,605 L972,605" fill="none" stroke="#edf3fa" stroke-width="1.5" stroke-linejoin="round"/>
<text x="28" y="631" fill="#adbdcf" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">A seek holds a normalized position. The two Play methods do not establish synchronized playback.</text></svg>