<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="508" viewBox="0 0 1000 508" role="img" aria-labelledby="title desc">
<title id="title">Upstream RelaxedIK objective structure</title><desc id="desc">The application supplies a desired position and fixed orientation. Upstream RelaxedIK minimizes competing normalized objective terms to produce a joint solution. The equation is conceptual, not a recovered set of solver weights.</desc>
