<a class="skip-link no-push-state no-mark-external" href="#_main">Skip to content</a>
<div id="_navbar" class="navbar fixed-top">
  <div class="content">
    <span class="sr-only">{{ site.data.strings.jump_to | default:"Jump to" }}{{ site.data.strings.colon | default:":" }}</span>
    <div class="nav-btn-bar">
      <a id="_menu" class="nav-btn no-hover" href="#_drawer--opened">
        <span class="sr-only">{{ site.data.strings.navigation | default:"Navigation" }}</span>
        <span class="icon-menu"></span>
      </a>
      <nav class="nav-span quick-nav" aria-label="Page navigation">
        {% for node in site.menu %}
        {% assign url = node.url | default:node.href %}
        <a href="{% include smart-url url=url %}" class="quick-nav-link{% if node.external %} external{% endif %}"
          {% if page.url == url %}aria-current="page"{% elsif url != '/' and page.url contains url %}aria-current="location"{% endif %}
          {% if node.rel %}rel="{{ node.rel }}"{% endif %}>{{ node.name | default:node.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </div>
</div>
<hr class="sr-only" hidden />
