{% include my-scripts.html %}
{% comment %}Offline mode (the Hydejack service worker) is gone; this only removes a worker a visitor may still have registered from an older version of the site.{% endcomment %}
<script type="module">
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration()
      .then(r => r && r.unregister())
      .catch(() => {});
  }
</script>
