{%- comment -%}
A screenshot of a live website inside a minimal browser window.
Params: src, srcset, url (shown without scheme), href (optional), alt,
width / height (intrinsic size of src), caption (optional)
{%- endcomment -%}
<figure class="browser">
  <div class="browser__bar">
    <span class="browser__lights" aria-hidden="true"><span></span><span></span><span></span></span>
    {%- if include.href %}
    <a class="browser__url mono" href="{{ include.href }}" target="_blank" rel="noopener">{{ include.url }}<span class="sr-only"> (opens in a new tab)</span></a>
    {%- else %}
    <span class="browser__url mono">{{ include.url }}</span>
    {%- endif %}
  </div>
  <img src="{{ include.src | relative_url }}" srcset="{{ include.srcset }}" sizes="(min-width: 64em) 46rem, 100vw" alt="{{ include.alt | escape }}" width="{{ include.width }}" height="{{ include.height }}" loading="lazy" decoding="async">
  {%- if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
