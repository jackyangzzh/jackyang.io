<header class="sh">
  <h2 class="sh__title" id="{{ include.id }}"><span class="sh__no" aria-hidden="true">{{ include.no }}</span>&nbsp;{{ include.title }}</h2>
  {%- if include.aux_url %}
  <a class="sh__aux qlink" href="{{ include.aux_url | relative_url }}">{{ include.aux }}{% if include.aux_icon %} {% include icon.html name=include.aux_icon %}{% endif %}</a>
  {%- endif %}
</header>
