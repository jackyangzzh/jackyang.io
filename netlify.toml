[build]
 # npm run build = jekyll build, then minify site.js in _site with esbuild.
 command = "npm run build"
 publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  RUBY_VERSION = "3.1.4"

# Consolidate legacy writing indexes at the canonical Writing page.
[[redirects]]
  from = "/blogs/*"
  to = "/writing/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/writing/"
  status = 301
  force = true

[[redirects]]
  from = "/posts/*"
  to = "/writing/"
  status = 301
  force = true

# The resume PDF was renamed; keep old links working.
[[redirects]]
  from = "/assets/Yang_Resume.pdf"
  to = "/assets/Jack_Yang_Resume.pdf"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    
# Cache static assets. Only fonts are immutable: other assets keep their names
# when replaced (the résumé PDF, site.js, images), so they must revalidate or
# returning visitors would see the old file for a year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
