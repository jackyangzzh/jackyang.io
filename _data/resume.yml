basics:
  name: "Jack Yang"
  label: "Building real-time AI agents for live conversation"
  picture: "./assets/img/profile.webp"
  email: "jackyangzzh@gmail.com"
  phone: ""
  website: ""
  summary: >
    I build real-time AI agents at [**Microsoft Teams AI**](https://www.microsoft.com/en-us/microsoft-teams/teams-ai){:target="_blank" rel="noopener noreferrer" .no-mark-external}, where I work on Facilitator, the Microsoft 365 Copilot agent that runs inside live Teams meetings. My focus is the orchestration, tool execution, context management, and multimodal features that let an agent keep up with a conversation as it happens. <br><br>
    Before Teams AI, I engineered the shared UI framework adopted by every product team at [**Microsoft Mesh**](/projects/mesh-avatars/) and was a key contributor to its avatar rendering pipeline, shipping weekly in 20+ languages to millions of users. Earlier, I built AR/VR interaction and multiplayer systems at [**Holos**](/projects/holos/), a Techstars startup, and helped it secure a $750K U.S. Air Force contract. <br><br>
    Outside work, I created [**FakeHaul**](/projects/fakehaul/), an AI-generated marketplace where every checkout is $0.00, covered by *The New York Times* and *Fast Company*. I'm also completing an M.S. in Computer Science (HCI) at Georgia Tech, where I research how AI systems interpret evidence in conversations. My research project, **Ground Tracker**, examines how later confirmation can hide a lack of support for an earlier action; the manuscript is under consideration at *Dialogue & Discourse*. I enjoy connecting low-latency systems with generative models, and I care as much about how the interaction feels as how the system is built.
