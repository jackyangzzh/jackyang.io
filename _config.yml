# Site
# ========================================================================================

url: https://jackyang.io
baseurl: ""
lang: en

title: Jack Yang

# Meta description (~150 chars) used when a page doesn't set its own.
description: >
  Jack Yang is a software engineer at Microsoft Teams AI building real-time multimodal
  agents for Microsoft 365 Copilot. Previously, he built avatar and XR systems for Microsoft Mesh.

# Short positioning line (not shown on the site; kept for reference and for
# jekyll-seo-tag on any page without a title).
tagline: Building real-time AI agents for live conversation

# Role line shown above the hero headline.
role: Software Engineer II · Microsoft Teams AI

# City for the live clock in the header and footer (an IANA time zone).
location:
  city: Seattle
  timezone: America/Los_Angeles

# Square image used by jekyll-seo-tag and the structured data.
logo: /assets/img/profile.webp

author:
  name: Jack Yang
  email: jackyangzzh@gmail.com

medium_username: jackyangzzh

# Primary navigation. The current page is marked by the travelling line; on the
# home page it follows the section in view (an item whose url has a #hash).
menu:
  - title: About
    url: /
  - title: Experience
    url: /#experience
  - title: Projects
    url: /projects/
  - title: Writing
    url: /writing/

# Contact actions, shared by the hero, the footer and the command menu.
contact:
  email: jackyangzzh@gmail.com
  schedule: https://calendly.com/jackyangzzh/30min
  resume: /assets/Jack_Yang_Resume.pdf

# Browser UI color, per color scheme (matches --bg in _sass/_tokens.scss).
theme_color:
  light: "#F1EFE9"
  dark: "#0E0E0D"

# Format of any future local writing permalinks
permalink: /writing/:categories/:year-:month-:day-:title/

defaults:
  # Don't include documents in assets in the sitemap
  - scope:
      path: assets/
    values:
      sitemap: false
  # `jekyll-seo-tag` marks collection outputs as `BlogPosting`; projects are `WebPage`s.
  - scope:
      type: projects
    values:
      layout: project
      seo:
        type: WebPage

kramdown:
  math_engine: null
  footnote_backlink: "&#x21a9;&#xfe0e;"

# Collections
# ----------------------------------------------------------------------------------------

collections:
  projects:
    permalink: /projects/:path/
    output: true

# File inclusion/exclusion
# ----------------------------------------------------------------------------------------

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - .lighthouse
  - .jekyll-cache
  - .sass-cache
  - "*.toml"
  - vendor
  - Gemfile
  - Gemfile.lock
include:
  - LICENSE.md

# Plugins
# ----------------------------------------------------------------------------------------

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jekyll-include-cache
  - jekyll-last-modified-at

# SEO Tag
# ---------------------------------------------------------------------------------------

twitter:
  username: jackyang

social:
  name: Jack Yang
  links:
    - https://jackyang.io/
    - https://github.com/jackyangzzh
    - https://www.linkedin.com/in/jackyangzzh/
    - https://medium.com/@jackyangzzh
    - https://x.com/jackyang

titles_from_headings:
  strip_title: true
  collections: true

sass:
  style: compressed
  sass_dir: _sass
